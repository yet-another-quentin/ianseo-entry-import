# Publie ImportInscriptions.zip dans la release quand un tag vX.Y.Z est poussé.
# Le module installé détecte cette release et propose la mise à jour.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: node --test tests/*.test.js

      - name: Version depuis le tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' ImportInscriptions/version.json > version.tmp
          mv version.tmp ImportInscriptions/version.json

      - name: Archive
        run: zip -r ImportInscriptions.zip ImportInscriptions -x '*.DS_Store'

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ImportInscriptions.zip --title "$GITHUB_REF_NAME" --generate-notes
