# Stable release: pushing a vX.Y.Z tag publishes EntryImport.zip as the "latest" release.
# Installed modules on the stable channel offer it as an update.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: node --test tests/*.test.js

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          jq --arg v "$v" '.version = $v' EntryImport/version.json > version.tmp
          mv version.tmp EntryImport/version.json

      - name: Archive
        run: zip -r EntryImport.zip EntryImport -x '*.DS_Store'

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" EntryImport.zip --title "$GITHUB_REF_NAME" --generate-notes --latest
